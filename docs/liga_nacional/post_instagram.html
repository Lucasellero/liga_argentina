<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Liga Nacional — KM Viajados Temporada Regular</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0c0d1e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  gap: 16px;
  font-family: system-ui, -apple-system, sans-serif;
  color: #e2e8f0;
}
canvas {
  max-width: min(100%, 640px);
  border-radius: 6px;
  box-shadow: 0 12px 60px rgba(0,0,0,0.6);
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  padding: 10px 26px;
  background: #8b5cf6;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
button:hover { background: #7c3aed; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="controls">
  <button id="dl">⬇ Descargar PNG (1080×1350)</button>
</div>

<script>
// kmBus = km en colectivo; kmAvion = km en avión (vuelos BsAs↔Comodoro)
// Gimnasia CR: 7 giras × 3.500 km r/t = 24.500 km en avión
// Resto: 1 visita a Comodoro × 3.500 km r/t = 3.500 km en avión
// Ordenado por kmBus + kmAvion descendente
const TEAMS = [
  { name:'GIMNASIA (CR)',     ciudad:'Comodoro Rivadavia',  giras:7, kmBus:12530, kmAvion:24500, cost:91455000, logo:'gimnasia_cr.jpeg'      },
  { name:'INDEPENDIENTE (O)', ciudad:'Oberá',               giras:7, kmBus:17161, kmAvion: 3500, cost:66863500, logo:'independiente_o.jpeg'  },
  { name:'OBERÁ',             ciudad:'Oberá',               giras:8, kmBus:15849, kmAvion: 3500, cost:62271500, logo:'obera.jpeg'            },
  { name:'PEÑAROL (MDP)',     ciudad:'Mar del Plata',       giras:8, kmBus:14903, kmAvion: 3500, cost:58960500, logo:'peñarol_mdp.jpeg'      },
  { name:'OLIMPICO (LB)',     ciudad:'La Banda',            giras:8, kmBus:14762, kmAvion: 3500, cost:58467000, logo:'olimpico_lb.jpeg'      },
  { name:'QUIMSA',            ciudad:'Santiago del Estero', giras:8, kmBus:14715, kmAvion: 3500, cost:58302500, logo:'quimsa.jpeg'           },
  { name:'SAN MARTÍN (C)',    ciudad:'Corrientes',          giras:8, kmBus:12800, kmAvion: 3500, cost:51600000, logo:'san_martin_c.jpeg'     },
  { name:'LA UNION FSA',     ciudad:'Formosa',             giras:7, kmBus:12654, kmAvion: 3500, cost:51089000, logo:'la_union_fsa.jpeg'     },
  { name:'REGATAS (C)',       ciudad:'Corrientes',          giras:7, kmBus:12226, kmAvion: 3500, cost:49591000, logo:'regatas_c.jpeg'        },
  { name:'ATENAS (C)',        ciudad:'Córdoba',             giras:7, kmBus:11921, kmAvion: 3500, cost:48523500, logo:'atenas_c.jpeg'         },
  { name:'INSTITUTO',         ciudad:'Córdoba',             giras:7, kmBus:11432, kmAvion: 3500, cost:46812000, logo:'instituto.jpeg'        },
  { name:'ARGENTINO (J)',     ciudad:'Junín',               giras:6, kmBus:10921, kmAvion: 3500, cost:45023500, logo:'argentino_j.jpeg'      },
  { name:'OBRAS',             ciudad:'Buenos Aires',        giras:5, kmBus:10719, kmAvion: 3500, cost:44316500, logo:'obras.jpeg'            },
  { name:'RACING (CH)',       ciudad:'Chivilcoy',           giras:5, kmBus:10171, kmAvion: 3500, cost:42398500, logo:'racing_ch.jpeg'        },
  { name:'UNION (SF)',        ciudad:'Santa Fe',            giras:7, kmBus:10114, kmAvion: 3500, cost:42199000, logo:'union_sf.jpeg'         },
  { name:'SAN LORENZO',      ciudad:'Buenos Aires',        giras:6, kmBus: 9932, kmAvion: 3500, cost:41562000, logo:'san_lorenzo.jpeg'      },
  { name:'PLATENSE',          ciudad:'Vicente López',       giras:6, kmBus: 9918, kmAvion: 3500, cost:41513000, logo:'platense.jpeg'         },
  { name:'BOCA',              ciudad:'Buenos Aires',        giras:6, kmBus: 9086, kmAvion: 3500, cost:38601000, logo:'boca.jpeg'             },
  { name:'FERRO',             ciudad:'Buenos Aires',        giras:5, kmBus: 8948, kmAvion: 3500, cost:38118000, logo:'ferro.jpeg'            },
];

const W = 1080, H = 1350;
const TEAL   = '#2dd4bf';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const IMG    = {};

Promise.all(TEAMS.map(t => new Promise(res => {
  const img = new Image();
  img.onload  = () => { IMG[t.logo] = img; res(); };
  img.onerror = () => res();
  img.src = 'logos/' + t.logo;
}))).then(render);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fmtCost(v) {
  return '$' + (v / 1e6).toFixed(1).replace('.', ',') + 'M';
}

function drawLogo(x, y, r, logo) {
  const img = IMG[logo];
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#1e1f3a';
  ctx.fill();
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s,
                  x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(139,92,246,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function render() {
  // ── Background ─────────────────────────────────────────────────────────────
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0d0e22');
  bg.addColorStop(1, '#10112a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top accent stripe (purple → teal → purple)
  const stripe = ctx.createLinearGradient(0, 0, W, 0);
  stripe.addColorStop(0,    'rgba(139,92,246,0.0)');
  stripe.addColorStop(0.15, 'rgba(139,92,246,0.75)');
  stripe.addColorStop(0.5,  'rgba(45,212,191,0.6)');
  stripe.addColorStop(0.85, 'rgba(139,92,246,0.75)');
  stripe.addColorStop(1,    'rgba(139,92,246,0.0)');
  ctx.fillStyle = stripe;
  ctx.fillRect(0, 0, W, 3);

  // Subtle vignette
  const vig = ctx.createRadialGradient(W / 2, H * 0.12, H * 0.04, W / 2, H * 0.5, H * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // ── League badge ────────────────────────────────────────────────────────────
  const badgeW = 170, badgeH = 28;
  const bx = W / 2 - badgeW / 2, by = 20;
  ctx.fillStyle = 'rgba(45,212,191,0.14)';
  roundRect(bx, by, badgeW, badgeH, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(45,212,191,0.42)';
  ctx.lineWidth = 1;
  roundRect(bx, by, badgeW, badgeH, 14);
  ctx.stroke();
  ctx.font = '600 13px system-ui';
  ctx.fillStyle = TEAL;
  ctx.textAlign = 'center';
  ctx.fillText('🏀  LIGA NACIONAL', W / 2, by + 19);

  // ── Title ───────────────────────────────────────────────────────────────────
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.font = '800 38px system-ui';
  ctx.fillText('EQUIPOS QUE MÁS', W / 2, 96);
  ctx.fillText('GASTARON EN VIAJES', W / 2, 140);

  ctx.font = '500 17px system-ui';
  ctx.fillStyle = 'rgba(139,92,246,0.88)';
  ctx.fillText('TEMPORADA REGULAR 2025/2026', W / 2, 168);

  // ── Stats cards ─────────────────────────────────────────────────────────────
  const CARDS = [
    { val: '$977,7M', lbl: 'GASTO TOTAL EST.' },
    { val: '230.762', lbl: 'KM EN COLECTIVO' },
    { val: '87.500',  lbl: 'KM EN AVIÓN' },
  ];
  const cW = 255, cH = 58, cGap = 27;
  const cTotalW = CARDS.length * cW + (CARDS.length - 1) * cGap;
  let cx = (W - cTotalW) / 2;
  const cY = 182;

  for (const c of CARDS) {
    ctx.fillStyle = 'rgba(255,255,255,0.042)';
    roundRect(cx, cY, cW, cH, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    roundRect(cx, cY, cW, cH, 10);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = '700 22px system-ui';
    ctx.fillStyle = TEAL;
    ctx.fillText(c.val, cx + cW / 2, cY + 26);

    ctx.font = '500 11px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fillText(c.lbl, cx + cW / 2, cY + 45);

    cx += cW + cGap;
  }

  // ── Divider ─────────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(36, 256);
  ctx.lineTo(W - 36, 256);
  ctx.stroke();

  // ── Column headers ──────────────────────────────────────────────────────────
  ctx.font = '500 11px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.textAlign = 'left';
  ctx.fillText('EQUIPO', 110, 274);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(45,212,191,0.45)';
  ctx.fillText('GASTO EST.', 772, 274);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText('KM TOTAL', 1052, 274);

  // ── Table rows ──────────────────────────────────────────────────────────────
  const ROW_START = 284;
  const ROW_H     = 54;
  const LOGO_R    = 22;
  const LOGO_X    = 76;

  const BAR_X     = 336;
  const BAR_MAX_W = 362;
  const BAR_H     = 13;
  const MAX_COST  = Math.max(...TEAMS.map(t => t.cost));
  const KM_CX     = 932;  // centro del bloque de km


  for (let i = 0; i < TEAMS.length; i++) {
    const t   = TEAMS[i];
    const ry  = ROW_START + i * ROW_H;
    const mid = ry + ROW_H / 2;

    // Alternating row tint
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.016)';
      ctx.fillRect(30, ry + 2, W - 60, ROW_H - 4);
    }

    // Rank
    const rankStr = String(i + 1);
    const bw = 30, bh = 20, bx2 = 14, bby = mid - bh / 2;
    if (i < 3) {
      ctx.fillStyle = 'rgba(139,92,246,0.18)';
      roundRect(bx2, bby, bw, bh, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(139,92,246,0.55)';
      ctx.lineWidth = 1;
      roundRect(bx2, bby, bw, bh, 5); ctx.stroke();
      ctx.font = '700 13px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
    } else {
      ctx.font = '500 12px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
    }
    ctx.textAlign = 'center';
    ctx.fillText(rankStr, bx2 + bw / 2, mid + 5);

    // Logo
    drawLogo(LOGO_X, mid, LOGO_R, t.logo);

    // Team name
    ctx.textAlign = 'left';
    ctx.font = '700 14px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.fillText(t.name, 110, mid - 5);

    // Ciudad · giras
    ctx.font = '400 11px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillText(t.ciudad + '  ·  ' + t.giras + ' giras', 110, mid + 11);

    // Bar (gasto)
    const barY = mid - BAR_H / 2;
    ctx.fillStyle = 'rgba(139,92,246,0.1)';
    roundRect(BAR_X, barY, BAR_MAX_W, BAR_H, 5);
    ctx.fill();

    const barW = (t.cost / MAX_COST) * BAR_MAX_W;
    const barGrad = ctx.createLinearGradient(BAR_X, 0, BAR_X + barW, 0);
    barGrad.addColorStop(0, 'rgba(109,40,217,0.88)');
    barGrad.addColorStop(1, 'rgba(167,139,250,0.96)');
    ctx.fillStyle = barGrad;
    roundRect(BAR_X, barY, barW, BAR_H, 5);
    ctx.fill();

    // Gasto value (después de la barra)
    ctx.textAlign = 'right';
    ctx.font = '700 13px system-ui';
    ctx.fillStyle = 'rgba(45,212,191,0.88)';
    ctx.fillText(fmtCost(t.cost), 772, mid + 4);

    // KM total
    const kmTotal = t.kmBus + t.kmAvion;
    ctx.font = '600 12px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText(kmTotal.toLocaleString('es-AR') + ' km', 1052, mid - 2);

    // Desglose bus · aéreo
    ctx.font = '500 11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.fillText(t.kmBus.toLocaleString('es-AR') + ' bus  ·  ' + t.kmAvion.toLocaleString('es-AR') + ' aéreo', 1052, mid + 12);
  }

  // ── Bottom divider ──────────────────────────────────────────────────────────
  const botY = ROW_START + TEAMS.length * ROW_H + 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(36, botY);
  ctx.lineTo(W - 36, botY);
  ctx.stroke();

  // ── Watermark ───────────────────────────────────────────────────────────────
  ctx.font = '400 12px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.textAlign = 'right';
  ctx.fillText('scouteado.com', W - 38, H - 18);
}

document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = 'liga_nacional_km_viajados.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
