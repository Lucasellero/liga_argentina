<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Liga Argentina — KM Viajados Conferencia Norte</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0c0d1e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  gap: 16px;
  font-family: system-ui, -apple-system, sans-serif;
  color: #e2e8f0;
}
canvas {
  max-width: min(100%, 640px);
  border-radius: 6px;
  box-shadow: 0 12px 60px rgba(0,0,0,0.6);
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  padding: 10px 26px;
  background: #8b5cf6;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
button:hover { background: #7c3aed; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="controls">
  <button id="dl">⬇ Descargar PNG (1080×1350)</button>
</div>

<script>
const TEAMS = [
  { name:'JUJUY BASQUET',      ciudad:'San Salvador de Jujuy', giras:6, km:11990, cost:41965000, logo:'jujuy_basquet.jpeg'     },
  { name:'RIVADAVIA (MZA)',     ciudad:'Mendoza',               giras:6, km:10172, cost:35602000, logo:'rivadavia_mza.jpeg'     },
  { name:'HURACAN (LH)',        ciudad:'Las Heras',             giras:6, km: 9997, cost:34989500, logo:'huracan_lh.jpeg'        },
  { name:'SALTA BASKET',        ciudad:'Salta',                 giras:6, km: 9755, cost:34142500, logo:'salta_basket.jpeg'      },
  { name:'COLON (SF)',          ciudad:'Santa Fe',              giras:5, km: 9408, cost:32928000, logo:'colon_sf.jpeg'          },
  { name:'COMUNICACIONES',      ciudad:'Mercedes',              giras:5, km: 8722, cost:30527000, logo:'comunicaciones.jpeg'    },
  { name:'VILLA SAN MARTIN',    ciudad:'Resistencia',           giras:5, km: 8626, cost:30191000, logo:'villa_san_martin.jpeg'  },
  { name:'ESTUDIANTES (T)',     ciudad:'San Miguel de Tucumán', giras:7, km: 8340, cost:29190000, logo:'estudiantes_t.jpeg'     },
  { name:'AMANCAY (LR)',        ciudad:'La Rioja',              giras:7, km: 7937, cost:27779500, logo:'amancay_lr.jpeg'        },
  { name:'FUSION RIOJANA',      ciudad:'La Rioja',              giras:7, km: 7937, cost:27779500, logo:'fusion_riojana.jpeg'    },
  { name:'INDEPENDIENTE (SDE)', ciudad:'Santiago del Estero',   giras:7, km: 7723, cost:27030500, logo:'independiente_sde.jpeg' },
  { name:'SP. SUARDI',          ciudad:'Suardi',                giras:6, km: 7709, cost:26981500, logo:'sp_suardi.jpeg'         },
  { name:'SANTA PAULA (G)',     ciudad:'Gálvez',                giras:6, km: 7388, cost:25858000, logo:'santa_paula_g.jpeg'     },
  { name:'HINDU (C)',           ciudad:'Córdoba',               giras:7, km: 7142, cost:24997000, logo:'hindu_c.jpeg'           },
  { name:'BOCHAS (CC)',         ciudad:'Colonia Caroya',        giras:6, km: 7009, cost:24531500, logo:'bochas_cc.jpeg'         },
  { name:'SAN ISIDRO',          ciudad:'San Francisco',         giras:5, km: 6638, cost:23233000, logo:'san_isidro.jpeg'        },
  { name:'BARRIO PARQUE',       ciudad:'Córdoba',               giras:5, km: 6403, cost:22410500, logo:'barrio_parque.jpeg'     },
];

const W = 1080, H = 1350;
const TEAL   = '#2dd4bf';
const MAX_KM = TEAMS[0].km;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const IMG    = {};

Promise.all(TEAMS.map(t => new Promise(res => {
  const img = new Image();
  img.onload  = () => { IMG[t.logo] = img; res(); };
  img.onerror = () => res();
  img.src = 'logos/' + t.logo;
}))).then(render);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fmtCost(v) {
  return '$' + (v / 1e6).toFixed(1).replace('.', ',') + 'M';
}

function drawLogo(x, y, r, logo) {
  const img = IMG[logo];
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#1e1f3a';
  ctx.fill();
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s,
                  x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(139,92,246,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function render() {
  // ── Background ─────────────────────────────────────────────────────────────
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0d0e22');
  bg.addColorStop(1, '#10112a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top accent stripe
  const stripe = ctx.createLinearGradient(0, 0, W, 0);
  stripe.addColorStop(0,    'rgba(139,92,246,0.0)');
  stripe.addColorStop(0.15, 'rgba(139,92,246,0.75)');
  stripe.addColorStop(0.5,  'rgba(45,212,191,0.6)');
  stripe.addColorStop(0.85, 'rgba(139,92,246,0.75)');
  stripe.addColorStop(1,    'rgba(139,92,246,0.0)');
  ctx.fillStyle = stripe;
  ctx.fillRect(0, 0, W, 3);

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H * 0.12, H * 0.04, W / 2, H * 0.5, H * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // ── League badge ────────────────────────────────────────────────────────────
  const badgeW = 178, badgeH = 28;
  const bx = W / 2 - badgeW / 2, by = 20;
  ctx.fillStyle = 'rgba(45,212,191,0.14)';
  roundRect(bx, by, badgeW, badgeH, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(45,212,191,0.42)';
  ctx.lineWidth = 1;
  roundRect(bx, by, badgeW, badgeH, 14);
  ctx.stroke();
  ctx.font = '600 13px system-ui';
  ctx.fillStyle = TEAL;
  ctx.textAlign = 'center';
  ctx.fillText('🏀  LIGA ARGENTINA', W / 2, by + 19);

  // ── Title ───────────────────────────────────────────────────────────────────
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.font = '800 38px system-ui';
  ctx.fillText('EQUIPOS QUE MÁS', W / 2, 92);
  ctx.fillText('KILÓMETROS RECORRIERON', W / 2, 136);

  ctx.font = '500 16px system-ui';
  ctx.fillStyle = 'rgba(139,92,246,0.88)';
  ctx.fillText('TEMPORADA REGULAR 2025/2026', W / 2, 162);

  ctx.font = '600 15px system-ui';
  ctx.fillStyle = TEAL;
  ctx.fillText('CONFERENCIA NORTE', W / 2, 183);

  // ── Stats cards ─────────────────────────────────────────────────────────────
  const CARDS = [
    { val: '17',      lbl: 'EQUIPOS' },
    { val: '32',      lbl: 'PJ POR EQUIPO' },
    { val: '142.896', lbl: 'KM TOTALES' },
  ];
  const cW = 255, cH = 58, cGap = 27;
  const cTotalW = CARDS.length * cW + (CARDS.length - 1) * cGap;
  let cx = (W - cTotalW) / 2;
  const cY = 199;

  for (const c of CARDS) {
    ctx.fillStyle = 'rgba(255,255,255,0.042)';
    roundRect(cx, cY, cW, cH, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    roundRect(cx, cY, cW, cH, 10);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = '700 22px system-ui';
    ctx.fillStyle = TEAL;
    ctx.fillText(c.val, cx + cW / 2, cY + 26);

    ctx.font = '500 11px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fillText(c.lbl, cx + cW / 2, cY + 45);

    cx += cW + cGap;
  }

  // ── Divider ─────────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(36, 270);
  ctx.lineTo(W - 36, 270);
  ctx.stroke();

  // ── Column headers ──────────────────────────────────────────────────────────
  ctx.font = '500 11px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.textAlign = 'left';
  ctx.fillText('EQUIPO', 110, 288);
  ctx.textAlign = 'right';
  ctx.fillText('KM TOTALES', 870, 288);
  ctx.fillStyle = 'rgba(45,212,191,0.45)';
  ctx.fillText('GASTO EST.', 1048, 288);

  // ── Table rows ──────────────────────────────────────────────────────────────
  const ROW_START = 298;
  const ROW_H     = 54;
  const LOGO_R    = 22;
  const LOGO_X    = 76;

  const BAR_X     = 346;
  const BAR_MAX_W = 440;
  const BAR_H     = 9;

  for (let i = 0; i < TEAMS.length; i++) {
    const t   = TEAMS[i];
    const ry  = ROW_START + i * ROW_H;
    const mid = ry + ROW_H / 2;

    // Alternating row tint
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.016)';
      ctx.fillRect(30, ry + 2, W - 60, ROW_H - 4);
    }

    // Rank
    const rankStr = String(i + 1);
    const bw = 30, bh = 20, bx2 = 14, bby = mid - bh / 2;
    if (i < 3) {
      ctx.fillStyle = 'rgba(139,92,246,0.18)';
      roundRect(bx2, bby, bw, bh, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(139,92,246,0.55)';
      ctx.lineWidth = 1;
      roundRect(bx2, bby, bw, bh, 5); ctx.stroke();
      ctx.font = '700 13px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
    } else {
      ctx.font = '500 12px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
    }
    ctx.textAlign = 'center';
    ctx.fillText(rankStr, bx2 + bw / 2, mid + 5);

    // Logo
    drawLogo(LOGO_X, mid, LOGO_R, t.logo);

    // Team name
    ctx.textAlign = 'left';
    ctx.font = '700 14px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.fillText(t.name, 110, mid - 5);

    // Ciudad · giras
    ctx.font = '400 11px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillText(t.ciudad + '  ·  ' + t.giras + ' giras', 110, mid + 11);

    // Bar background track
    const barY = mid - BAR_H / 2;
    ctx.fillStyle = 'rgba(139,92,246,0.1)';
    roundRect(BAR_X, barY, BAR_MAX_W, BAR_H, 4);
    ctx.fill();

    // Bar fill
    const barW = (t.km / MAX_KM) * BAR_MAX_W;
    const barGrad = ctx.createLinearGradient(BAR_X, 0, BAR_X + barW, 0);
    barGrad.addColorStop(0, 'rgba(109,40,217,0.88)');
    barGrad.addColorStop(1, 'rgba(167,139,250,0.96)');
    ctx.fillStyle = barGrad;
    roundRect(BAR_X, barY, barW, BAR_H, 4);
    ctx.fill();

    // KM total
    ctx.textAlign = 'right';
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText(t.km.toLocaleString('es-AR'), 870, mid + 4);

    // Gasto estimado
    ctx.font = '600 12px system-ui';
    ctx.fillStyle = 'rgba(45,212,191,0.82)';
    ctx.fillText(fmtCost(t.cost), 1048, mid + 4);
  }

  // ── Bottom divider ──────────────────────────────────────────────────────────
  const botY = ROW_START + TEAMS.length * ROW_H + 6;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(36, botY);
  ctx.lineTo(W - 36, botY);
  ctx.stroke();

  // ── Watermark ───────────────────────────────────────────────────────────────
  ctx.font = '400 12px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.textAlign = 'right';
  ctx.fillText('scouteado.com', W - 38, H - 18);
}

document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = 'liga_argentina_km_conf_norte.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
