name: Scraper diario

on:
  # Cron reactivado (septiembre 2026): arrancó la temporada 2026/27 de Liga Argentina
  # y Liga Nacional. Femenina y Desarrollo siguen con sus pasos comentados más abajo
  # hasta que arranquen sus propias temporadas.
  schedule:
    - cron: '30 4 * * *'   # 01:30 ART (UTC-3)
    - cron: '0 9 * * *'    # 06:00 ART (UTC-3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      # ── Descargar PBP actuales desde Supabase (para scraping incremental) ──
      # Acotado a Argentina + Nacional mientras Femenina y Desarrollo estén paradas.
      - name: Descargar PBP desde Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          for LEAGUE in liga_argentina liga_nacional; do
            FILE="docs/${LEAGUE}/${LEAGUE}_pbp.csv"
            STATUS=$(curl -sf -o "$FILE" -w "%{http_code}" \
              "${SUPABASE_URL}/storage/v1/object/public/pbp/${LEAGUE}_pbp.csv" 2>/dev/null || echo "000")
            echo "$LEAGUE PBP: HTTP $STATUS"
          done

      # ── Liga Argentina ──────────────────────────────────────────────────────
      - name: Stats – Liga Argentina
        run: python scraper/data_scraper.py

      - name: Tiros – Liga Argentina
        run: python scraper/shot_map_scraper.py

      - name: Jugada a jugada – Liga Argentina
        run: python scraper/pbp_scraper.py

      - name: Recap – Liga Argentina
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/recap_generator.py --liga liga_argentina

      # ── Liga Nacional ───────────────────────────────────────────────────────
      - name: Stats – Liga Nacional
        run: python scraper/data_scraper_nacional.py

      - name: Tiros – Liga Nacional
        run: python scraper/shot_map_scraper_nacional.py

      - name: Jugada a jugada – Liga Nacional
        run: python scraper/pbp_scraper_nacional.py

      # ── Limpiar partidos fuera de temporada regular (torneos especiales) ─────
      # Clave estable fecha|equipoA|equipoB — el IdPartido es dinámico y cambia en
      # cada request, así que no sirve como identificador persistente entre corridas
      # (ver CLAUDE.md "IDs dinámicos del sitio"). Vacío para 2026/27 hasta que
      # aparezca un torneo fuera de temporada regular que haya que excluir.
      - name: Eliminar partidos fuera de temporada regular – Liga Nacional
        run: |
          python -c "
          import pandas as pd

          EXCLUDED_PAIRS = set()  # {('DD/MM/AAAA', frozenset(['EQUIPO_A', 'EQUIPO_B']))}

          def is_excluded(fecha, equipo, rival):
              return (fecha, frozenset([equipo, rival])) in EXCLUDED_PAIRS

          for f, local_col, visit_col in [
              ('docs/liga_nacional/liga_nacional.csv', 'Equipo', 'Rival'),
              ('docs/liga_nacional/liga_nacional_shots.csv', 'Equipo_local', 'Equipo_visitante'),
              ('docs/liga_nacional/liga_nacional_pbp.csv', 'Equipo_local', 'Equipo_visitante'),
          ]:
              df = pd.read_csv(f)
              mask = df.apply(lambda r: is_excluded(r['Fecha'], r[local_col], r[visit_col]), axis=1)
              before = len(df)
              df = df[~mask].reset_index(drop=True)
              df.to_csv(f, index=False, encoding='utf-8-sig')
              print(f'{f}: {before} → {len(df)} filas')
          "

      - name: Recap – Liga Nacional
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/recap_generator.py --liga liga_nacional

      # ── Modelo Liga Nacional ────────────────────────────────────────────────
      - name: Reentrenar modelo de probabilidad – Liga Nacional
        run: python modelos/modelo_liga_nacional.py

      # ── Liga Femenina ───────────────────────────────────────────────────────
      # Desactivada (septiembre 2026): la temporada 2026/27 de Liga Femenina
      # todavía no arrancó. Descomentar estos 3 steps cuando arranque.
      # - name: Stats – Liga Femenina
      #   run: python scraper/data_scraper_femenina.py
      #
      # - name: Tiros – Liga Femenina
      #   run: python scraper/shot_map_scraper_femenina.py
      #
      # - name: Jugada a jugada – Liga Femenina
      #   run: python scraper/pbp_scraper_femenina.py

      # ── Liga de Desarrollo ──────────────────────────────────────────────────
      # Desactivada (septiembre 2026): la temporada 2026/27 de Liga de Desarrollo
      # todavía no arrancó. Descomentar estos 3 steps cuando arranque.
      # - name: Stats – Liga de Desarrollo
      #   run: python scraper/data_scraper_proximo.py
      #
      # - name: Tiros – Liga de Desarrollo
      #   run: python scraper/shot_map_scraper_proximo.py
      #
      # - name: Jugada a jugada – Liga de Desarrollo
      #   run: python scraper/pbp_scraper_proximo.py

      # ── Subir PBP a Supabase (versión filtrada para web, <50 MB) ────────────
      # Acotado a Argentina + Nacional mientras Femenina y Desarrollo estén paradas.
      - name: Subir PBP a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import pandas as pd, os, subprocess

          KEEP = {
              'CAMBIO-JUGADOR-ENTRA','CAMBIO-JUGADOR-SALE',
              'CANASTA-1P','CANASTA-2P','CANASTA-3P',
              'TIRO1-FALLADO','TIRO2-FALLADO','TIRO3-FALLADO',
              'REBOTE-DEFENSIVO','REBOTE-OFENSIVO',
              'ASISTENCIA','PERDIDA','RECUPERACION',
              'INICIO-PARTIDO','FINAL-PARTIDO',
              'INICIO-PERIODO','FINAL-PERIODO',
          }

          files = [
              ('liga_argentina', 'docs/liga_argentina/liga_argentina_pbp.csv'),
              ('liga_nacional',  'docs/liga_nacional/liga_nacional_pbp.csv'),
          ]

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']

          for league, path in files:
              df = pd.read_csv(path)
              web = df[df['Tipo'].isin(KEEP)]  # conservar Fecha: la usan el cache incremental y PBP_STABLE_MAP
              tmp = f'/tmp/{league}_pbp_web.csv'
              web.to_csv(tmp, index=False)
              mb = os.path.getsize(tmp) / 1024 / 1024
              print(f'{league}: {len(df)} → {len(web)} filas ({mb:.1f} MB)')
              r = subprocess.run([
                  'curl','-s','-o','/dev/null','-w','%{http_code}',
                  '-X','PUT',
                  f'{url}/storage/v1/object/pbp/{league}_pbp.csv',
                  '-H',f'Authorization: Bearer {key}',
                  '-H','Content-Type: text/csv',
                  '-H','x-upsert: true',
                  '--max-time','300','-T',tmp,
              ], capture_output=True, text=True)
              print(f'{league} upload: HTTP {r.stdout}')
          "

      # ── Commit + push (dispara deploy en Vercel) ────────────────────────────
      - name: Commitear CSVs actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES=(
            docs/liga_argentina/liga_argentina.csv
            docs/liga_argentina/liga_argentina_shots.csv
            docs/liga_argentina/recaps.json
            docs/liga_nacional/liga_nacional.csv
            docs/liga_nacional/liga_nacional_shots.csv
            docs/liga_nacional/predicciones_upcoming.csv
            docs/liga_nacional/recaps.json
            modelos/modelo_liga_nacional_prod.pkl
          )
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && git add "$f" || echo "skip (no existe): $f"
          done
          git diff --cached --quiet || git commit -m "data: actualizar CSVs $(date +'%d-%m-%Y')"
          git push
